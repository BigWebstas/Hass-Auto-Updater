<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18BCF2"/>
      <stop offset="50%" stop-color="#0288D1"/>
      <stop offset="100%" stop-color="#015080"/>
    </linearGradient>
    <linearGradient id="sheen1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="shadow1" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00182C" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#bg1)"/>
  <rect x="24" y="24" width="464" height="232" rx="108" ry="108" fill="url(#sheen1)"/>
  <rect x="25" y="25" width="462" height="462" rx="107" ry="107" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"/>

  <g filter="url(#shadow1)">
    <!-- Orbiting Update Ring -->
    <path d="M 118.38,159.64 A 168 168 0 0 1 418.28,299.48" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round"/>
    <polygon points="409.48,332.32 391.23,292.23 445.32,306.73" fill="#FFFFFF"/>

    <path d="M 393.62,352.36 A 168 168 0 0 1 93.72,212.52" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round"/>
    <polygon points="102.52,179.68 120.77,219.77 66.68,205.27" fill="#FFFFFF"/>

    <!-- Unified HA House -->
    <path d="M 194,340 C 186,340 180,334 180,326 L 180,230 L 164,230 C 158,230 156,222 161,218 L 252,141 C 254.5,139 257.5,139 260,141 L 290,166 L 290,154 C 290,150 293,147 297,147 L 311,147 C 315,147 318,150 318,154 L 318,190 L 351,218 C 356,222 354,230 348,230 L 332,230 L 332,326 C 332,334 326,340 318,340 Z" fill="#FFFFFF"/>

    <!-- Connected HA Circuit Nodes inside House (HA Blue) -->
    <!-- Top Node -->
    <circle cx="256" cy="246" r="14" fill="#0288D1"/>
    <!-- Bottom Left Node -->
    <circle cx="224" cy="296" r="11" fill="#0288D1"/>
    <!-- Bottom Right Node -->
    <circle cx="288" cy="296" r="11" fill="#0288D1"/>
    <!-- Center small pulse node -->
    <circle cx="256" cy="276" r="6" fill="#0288D1"/>

    <!-- Connection Traces -->
    <line x1="256" y1="246" x2="224" y2="296" stroke="#0288D1" stroke-width="6" stroke-linecap="round"/>
    <line x1="256" y1="246" x2="288" y2="296" stroke="#0288D1" stroke-width="6" stroke-linecap="round"/>
    <line x1="224" y1="296" x2="288" y2="296" stroke="#0288D1" stroke-width="6" stroke-linecap="round"/>
    <line x1="256" y1="246" x2="256" y2="276" stroke="#0288D1" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
